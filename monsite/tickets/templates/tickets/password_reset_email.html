<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialisation du mot de passe</title>
</head>
<body>
  <p>Bonjour {{ user.username }},</p>
  <p>Une demande de réinitialisation du mot de passe de ton compte TicketHub a été reçue.</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'tickets:password_reset_confirm' uidb64=uid token=token %}">Choisir un nouveau mot de passe</a></p>
  <p>Si tu n’es pas à l’origine de cette demande, ignore cet e-mail. Ton mot de passe ne changera pas sans validation du lien.</p>
</body>
</html>
