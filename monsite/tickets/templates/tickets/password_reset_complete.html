<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe modifié | TicketHub</title>
  <style>
    :root{color-scheme:dark;--bg:#07100e;--surface:#0d1916;--line:rgba(142,207,174,.19);--text:#e7f2eb;--muted:#91a69a;--green:#8de6b2}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 0%,rgba(46,139,87,.18),transparent 32rem),var(--bg);color:var(--text);font:15px/1.7 Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(520px,100%);padding:clamp(24px,6vw,40px);border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 28px 90px #0004}.mark{display:grid;place-items:center;width:46px;height:46px;border:1px solid #8de6b266;border-radius:12px;color:var(--green);font-size:22px}h1{margin:22px 0 10px;font-size:clamp(24px,5vw,32px);line-height:1.2}p{color:var(--muted)}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Mot de passe mis à jour.</h1>
    <p>Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
    <p><a href="{% url 'tickets:login' %}">Se connecter à TicketHub</a></p>
  </main>
</body>
</html>
